services:
  db:
    image: postgres:16-alpine
    container_name: digsite-db
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      POSTGRES_USER: digsite
      POSTGRES_PASSWORD: digsite
      POSTGRES_DB: digsite
    volumes:
      - digsite-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digsite -d digsite"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  digsite-db:
