# A production deploy: db, an optional minio (profile `s3`), the server
# (migrates then starts — Dockerfile.server), the web static build behind
# its own caddy (Dockerfile.web), and one front caddy terminating TLS for
# both (Caddyfile). `docker compose -f deploy/docker-compose.yml up -d`
# from the repo root, with `deploy/.env` filled in from
# .env.production.example — see README.md.
services:
  db:
    # postgres:16-alpine with pgvector built in (../db/Dockerfile): the same
    # musl base as before, so an existing volume and its indexes carry over.
    build:
      context: ../db
    image: digsite-postgres:16-pgvector
    container_name: digsite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digsite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-digsite}
    volumes:
      - digsite-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-digsite} -d ${POSTGRES_DB:-digsite}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Only started with `--profile s3`; skip it entirely when STORAGE=s3
  # points at a real bucket instead (S3_ENDPOINT in deploy/.env).
  minio:
    image: quay.io/minio/minio:latest
    container_name: digsite-minio
    profiles: ["s3"]
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-digsite}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY required for the s3 profile}
    volumes:
      - digsite-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      db:
        condition: service_healthy
    environment:
      # NODE_ENV=production already comes from Dockerfile.server's own ENV
      # — not repeated here. It's what gates seed.ts's refusal (env.ts) and
      # Better Auth's rateLimit default (auth.ts's comment).
      DATABASE_URL: postgres://${POSTGRES_USER:-digsite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-digsite}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      # Phase 5 section 3 (docs/phases/5-hardening.md): 0.0.0.0, not the
      # server's own 127.0.0.1 default (server/src/env.ts) — inside this
      # container the loopback isn't reachable from the `caddy` container.
      HOST: 0.0.0.0
      # PUBLIC_ORIGIN (not SERVER_ORIGIN) is the real, externally-visible
      # origin behind Caddy — env.ts prefers it verbatim, port and all,
      # over SERVER_ORIGIN+PORT's local-dev math. Better Auth's baseURL
      # reads this, and through it, whether cookies get Secure (auth.ts's
      # comment) — getting this right is what makes that automatic.
      PUBLIC_ORIGIN: https://api.${DOMAIN}
      WEB_ORIGIN: https://${DOMAIN}
      DATA_DIR: /data
      STORAGE: ${STORAGE:-fs}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      SIGNUP: ${SIGNUP:-invite}
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
      GROUP_QUOTA_GB: ${GROUP_QUOTA_GB:-20}
      MAX_GROUPS_PER_USER: ${MAX_GROUPS_PER_USER:-3}
      EMBEDDINGS: ${EMBEDDINGS:-on}
      MODELS_DIR: /data/models
      INVITATION_EXPIRES_IN: ${INVITATION_EXPIRES_IN:-172800}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      LADDER_BUDGET_MB: ${LADDER_BUDGET_MB:-4096}
      MATERIALISE_BUDGET_MB: ${MATERIALISE_BUDGET_MB:-2048}
      COARSE_BUDGET_MB: ${COARSE_BUDGET_MB:-1024}
      SESSION_EXPIRES_IN: ${SESSION_EXPIRES_IN:-604800}
      SESSION_UPDATE_AGE: ${SESSION_UPDATE_AGE:-86400}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-10}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
      RATE_UPLOAD_PER_MIN: ${RATE_UPLOAD_PER_MIN:-12000}
      RATE_TUS_CREATE_PER_MIN: ${RATE_TUS_CREATE_PER_MIN:-600}
      RATE_SOCKET_CONNECT_PER_MIN: ${RATE_SOCKET_CONNECT_PER_MIN:-30}
      RATE_SCENE_EMIT_PER_SEC: ${RATE_SCENE_EMIT_PER_SEC:-30}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
      UPLOAD_BATCH_MAX_MB: ${UPLOAD_BATCH_MAX_MB:-100}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-100000000}
      DECODE_TIMEOUT_MS: ${DECODE_TIMEOUT_MS:-15000}
      # Unset by default (empty), same posture as AUTH_SECRET's own
      # required-with-no-default: GET /metrics 404s until an operator opts
      # in by setting this in deploy/.env.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - digsite-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8800/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_SERVER_ORIGIN: https://api.${DOMAIN}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - digsite-caddy-data:/data
      - digsite-caddy-config:/config
    depends_on:
      - server
      - web
    restart: unless-stopped

volumes:
  digsite-postgres:
  digsite-minio:
  digsite-data:
  digsite-caddy-data:
  digsite-caddy-config:
